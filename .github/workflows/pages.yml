name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:static
      # 镜像站没有后端，Exa 请求转发到腾讯云主站的同源代理。
      - name: Inject Exa proxy
        env:
          EXA_PROXY_PATH: https://starvault.deline.top/api/exa/search
        run: |
          node scripts/inject-runtime-config.js public/runtime-config.js "$EXA_PROXY_PATH"
          grep -qF "$EXA_PROXY_PATH" public/runtime-config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
