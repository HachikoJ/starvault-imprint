# StarVault Imprint - starvault.deline.top 静态站
#
# 只服务 public/ 的静态产物，不读取服务器上的 data/、output/ 或 .env。
# 唯一的反向代理是 /api/exa/search：Exa 的浏览器跨域白名单只放行它自己的
# 控制台和 localhost，静态页无法直连，只能由这里转发访客自带的 Key。
# 发布流程见 deploy/deploy-static.sh。

# Exa 代理按访客 IP 限流，避免这个转发端点被当成公开中继滥用。
limit_req_zone $binary_remote_addr zone=starvault_exa:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name starvault.deline.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_acme-challenge;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name starvault.deline.top;

    access_log /var/log/nginx/starvault.deline.top.access.log combined;
    error_log /var/log/nginx/starvault.deline.top.error.log warn;

    ssl_certificate /etc/nginx/ssl/deline.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/deline.top/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:StarvaultSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    server_tokens off;

    root /var/www/starvault-imprint;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    # Exa 走同源 /api/exa/search，'self' 已覆盖；api.exa.ai 只留给本机直连调试。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.github.com https://api.deepseek.com https://api.tavily.com https://api.exa.ai; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_acme-challenge;
        default_type text/plain;
        try_files $uri =404;
    }

    # 同源 Exa 搜索代理：POST /api/exa/search -> https://api.exa.ai/search。
    # 服务器不保存任何凭据，Key 由访客浏览器放在 x-api-key 里带过来。
    location = /api/exa/search {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        limit_req zone=starvault_exa burst=30 nodelay;
        limit_req_status 429;

        # 只对自有站点回跨域头；其他来源拿不到 Access-Control-Allow-Origin。
        set $starvault_exa_origin "";
        if ($http_origin ~* ^https://(starvault\.deline\.top|hachikoj\.github\.io)$) {
            set $starvault_exa_origin $http_origin;
        }

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $starvault_exa_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type, x-api-key" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Vary Origin always;
            add_header X-Content-Type-Options nosniff always;
            return 204;
        }

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.exa.ai;
        proxy_set_header Origin "";
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_pass https://api.exa.ai/search;

        add_header Access-Control-Allow-Origin $starvault_exa_origin always;
        add_header Vary Origin always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
        expires -1;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:env|git|svn|htaccess|htpasswd|log|bak|backup|sql|conf|ini|map)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
